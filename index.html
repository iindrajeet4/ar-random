<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Random Reward</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="app.js" defer></script>
</head>

<body>

    <div id="status">
        Ready
    </div>

    <button id="startBtn">
        Start AR
    </button>

    <!-- Debug image -->
    <img
        id="debugImage"
        style="
            position:fixed;
            top:100px;
            left:50%;
            transform:translateX(-50%);
            width:250px;
            height:250px;
            object-fit:contain;
            z-index:1000;
            display:none;
        "
    >

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true">

        <a-camera
            position="0 0 0">
        </a-camera>

        <a-image
            id="reward"
            position="0 0 -2"
            width="1.4"
            height="1.4"
            visible="false">
        </a-image>

    </a-scene>

</body>

</html>
