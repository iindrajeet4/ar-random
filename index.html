<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Random Reward</title>
    <link rel="stylesheet" href="style.css">

    <!-- A-Frame และ MindAR สำหรับ WebAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script src="app.js" defer></script>
</head>
<body>

    <div id="status">Press the button to start AR</div>

    <button id="startBtn">
        Start AR
    </button>

    <!-- AR Scene (เปลี่ยนมาโหลดไฟล์ targets.mind สำหรับสแกน QR Code) -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- เป้าหมายการสแกน (Target Index 0) — เพิ่ม id="rewardTarget" เพื่อให้ app.js
             ฟัง event targetFound / targetLost ได้ (เดิมไม่มี id เลย เกาะ event ไม่ได้) -->
        <a-entity id="rewardTarget" mindar-image-target="targetIndex: 0">
            <a-image
                id="reward"
                position="0 0 0"
                rotation="0 0 0"
                width="1"
                height="1"
                visible="false">
            </a-image>
        </a-entity>

    </a-scene>

</body>
</html>
